<header class="ft-header"><p class="ft-kicker" id="ft-kicker">Course project · AST5220 Cosmology II · UiO · June 2024</p><h1 class="ft-title" id="ft-title">Computing the CMB power spectrum</h1><p class="ft-byline" id="ft-byline">Iván Villegas-Pérez — Supervisors: Prof. David F. Mota & Dr. Hans A. Winther (UiO)</p><div class="ft-sidebar"><a class="btn-outline" style="font-size:.8125rem;padding:.375rem .875rem" href="public/reports/cmb-power-spectrum.pdf" target="_blank" rel="noopener"><span data-en="Read PDF &#8599;" data-es="Leer PDF &#8599;">Read PDF &#8599;</span></a><a class="btn-outline" style="font-size:.8125rem;padding:.375rem .875rem" href="https://github.com/ivanvillegas7/CMB_power_spectrum" target="_blank" rel="noopener">GitHub &#8599;</a><span id="ft-badges"></span></div><p id="ft-lang-note" style="margin-top:.75rem;font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)"></p></header>

<script>
var _kEN="Course project \u00b7 AST5220 Cosmology II \u00b7 UiO \u00b7 June 2024",_kES="Proyecto de asignatura \u00b7 AST5220 Cosmolog\u00eda II \u00b7 UiO \u00b7 junio de 2024";
var _tEN="Computing the CMB power spectrum",_tES="C\u00e1lculo del espectro de potencias del CMB";
var _bEN="Iv\u00e1n Villegas-P\u00e9rez \u2014 Supervisors: Prof. David F. Mota & Dr. Hans A. Winther (UiO)",_bES="Iv\u00e1n Villegas-P\u00e9rez \u2014 Tutores: Prof. David F. Mota y Dr. Hans A. Winther (UiO)";
var _inst=["uio"];
var _secs=[{"h2en": "Abstract", "h2es": "Resumen", "items": [{"t": "p", "en": "In this project the angular power spectrum of the Cosmic Microwave Background (CMB) is computed from first principles using a C++ implementation following the AST5220 course framework. The pipeline is split into four milestones: (I) background cosmology, (II) recombination history, (III) linear perturbations and (IV) the CMB and matter power spectra. The ΛCDM Planck 2018 parameter set is used throughout. The final outputs are the CMB temperature power spectrum $D_\\ell$ and the total matter power spectrum $P(k)$, both in good agreement with the expected theoretical shapes.", "es": "En este proyecto se calcula el espectro angular de potencias del Fondo Cósmico de Microondas (CMB) a partir de primeros principios usando una implementación en C++ que sigue el marco del curso AST5220. La cadena se divide en cuatro hitos: (I) cosmología de fondo, (II) historia de la recombinación, (III) perturbaciones lineales y (IV) los espectros de potencias del CMB y de la materia. Se usa el conjunto de parámetros Planck 2018 de ΛCDM. Los resultados finales son el espectro de potencias de temperatura del CMB $D_\\ell$ y el espectro de potencias total de la materia $P(k)$, ambos en buen acuerdo con las formas teóricas esperadas."}]}, {"h2en": "I. Background cosmology", "h2es": "I. Cosmología de fondo", "items": [{"t": "p", "en": "Working in flat FLRW with $x=\\ln a$, the Hubble parameter is", "es": "Trabajando en FLRW plano con $x=\\ln a$, el parámetro de Hubble es"}, {"t": "math", "tex": "H(x)=H_0\\sqrt{(\\Omega_{B,0}+\\Omega_{\\rm CDM,0})e^{-3x}+\\Omega_{\\gamma,0}(1+\\frac{4}{11}N_{\\rm eff})^{4/3}e^{-4x}+\\Omega_{\\Lambda,0}}"}, {"t": "p", "en": "with the Planck 2018 baseline parameters: $h=0.67$, $T_{\\rm CMB,0}=2.7255\\,{\\rm K}$, $N_{\\rm eff}=3.046$, $\\Omega_{B,0}=0.05$, $\\Omega_{\\rm CDM,0}=0.267$, $\\Omega_{\\Lambda,0}=1-\\Omega_{B,0}-\\Omega_{\\rm CDM,0}-\\Omega_{\\gamma,0}-\\Omega_{\\nu,0}$, $n_s=0.965$, $A_s=2.1\\times10^{-9}$. The conformal time $\\eta(x)=\\int_{-\\infty}^x c/(aH)\\,dx'$ and the cosmic time $t(x)$ are integrated alongside.", "es": "con los parámetros base de Planck 2018: $h=0.67$, $T_{\\rm CMB,0}=2.7255\\,{\\rm K}$, $N_{\\rm eff}=3.046$, $\\Omega_{B,0}=0.05$, $\\Omega_{\\rm CDM,0}=0.267$, $\\Omega_{\\Lambda,0}=1-\\Omega_{B,0}-\\Omega_{\\rm CDM,0}-\\Omega_{\\gamma,0}-\\Omega_{\\nu,0}$, $n_s=0.965$, $A_s=2.1\\times10^{-9}$. El tiempo conforme $\\eta(x)$ y el tiempo cósmico $t(x)$ se integran simultáneamente."}, {"t": "fig", "src": "public/figures/cmb/omegas.png", "cen": "Density parameters $\\Omega_i(x)$ as a function of $x=\\ln a$, showing the three cosmological epochs (radiation, matter and $\\Lambda$ domination).", "ces": "Parámetros de densidad $\\Omega_i(x)$ en función de $x=\\ln a$, mostrando las tres épocas cosmológicas (dominación de radiación, materia y $\\Lambda$)."}, {"t": "fig", "src": "public/figures/cmb/eta_over_c.png", "cen": "Conformal time $\\eta(x)/c$ — the comoving horizon — as a function of $x=\\ln a$.", "ces": "Tiempo conforme $\\eta(x)/c$ — el horizonte comóvil — en función de $x=\\ln a$."}]}, {"h2en": "II. Recombination history", "h2es": "II. Historia de la recombinación", "items": [{"t": "p", "en": "The free-electron fraction $X_e(x)$ is computed using the Saha equation deep in equilibrium and the Peebles ODE around recombination. From $X_e$ we derive the optical depth", "es": "La fracción de electrones libres $X_e(x)$ se calcula usando la ecuación de Saha en equilibrio profundo y la EDO de Peebles en torno a la recombinación. A partir de $X_e$ derivamos la profundidad óptica"}, {"t": "math", "tex": "\\tau(x)=-\\int_x^0 n_e\\,\\sigma_T\\,c\\,\\frac{a}{H}\\,dx',\\qquad \\tilde{g}(x)=-\\dot\\tau\\,e^{-\\tau(x)}"}, {"t": "fig", "src": "public/figures/cmb/Xe.png", "cen": "Free-electron fraction $X_e(x)$: Saha early, Peebles through recombination. Last scattering occurs around $z\\simeq1090$.", "ces": "Fracción de electrones libres $X_e(x)$: Saha en fases tempranas, Peebles durante la recombinación. La última dispersión ocurre en torno a $z\\simeq1090$."}, {"t": "fig", "src": "public/figures/cmb/tau.png", "cen": "Optical depth $\\tau(x)$ and its first two derivatives. The visibility function $\\tilde{g}(x)$ peaks sharply at last scattering.", "ces": "Profundidad óptica $\\tau(x)$ y sus dos primeras derivadas. La función de visibilidad $\\tilde{g}(x)$ alcanza un máximo afilado en la última dispersión."}]}, {"h2en": "III. Linear perturbations", "h2es": "III. Perturbaciones lineales", "items": [{"t": "p", "en": "The Einstein–Boltzmann hierarchy is integrated for each comoving wavenumber $k$, starting from tight-coupling initial conditions. The metric potentials $\\Phi$, $\\Psi$ and the temperature multipoles $\\Theta_\\ell$ are obtained. In the tight-coupling regime only $\\Theta_0$, $\\Theta_1$ and $\\Theta_2$ are evolved; after decoupling the full hierarchy (up to $\\ell_{\\rm max}=8$) is integrated. The source function for the line-of-sight integral is", "es": "La jerarquía de Einstein-Boltzmann se integra para cada número de onda comóvil $k$, partiendo de condiciones iniciales de acoplamiento estrecho. Se obtienen los potenciales métricos $\\Phi$, $\\Psi$ y los multipolos de temperatura $\\Theta_\\ell$. En el régimen de acoplamiento estrecho solo se evolucionan $\\Theta_0$, $\\Theta_1$ y $\\Theta_2$; después del desacoplamiento se integra la jerarquía completa (hasta $\\ell_{\\rm max}=8$). La función fuente para la integral en la línea de visión es"}, {"t": "math", "tex": "\\tilde{S}(k,x)=\\tilde{g}\\!\\left(\\Theta_0+\\Psi+\\frac{1}{4}\\Pi\\right)+e^{-\\tau}(\\dot\\Psi-\\dot\\Phi)-\\frac{1}{ck}\\frac{d}{dx}(\\mathcal{H}\\tilde{g}v_b)+\\frac{3}{4c^2k^2}\\frac{d^2}{dx^2}(\\mathcal{H}^2\\tilde{g}\\Pi)"}, {"t": "fig", "src": "public/figures/cmb/density.png", "cen": "Density perturbations $\\delta$ for CDM, baryons and photons as a function of $x=\\ln a$, for several values of $k$.", "ces": "Perturbaciones de densidad $\\delta$ para CDM, bariones y fotones en función de $x=\\ln a$, para varios valores de $k$."}]}, {"h2en": "IV. CMB and matter power spectra", "h2es": "IV. Espectros de potencias del CMB y de la materia", "items": [{"t": "p", "en": "The line-of-sight integral gives the temperature transfer functions $\\Theta_\\ell(k,0)$ via", "es": "La integral en la línea de visión da las funciones de transferencia de temperatura $\\Theta_\\ell(k,0)$ mediante"}, {"t": "math", "tex": "\\Theta_\\ell(k,0)=\\int_{-\\infty}^0 \\tilde{S}(k,x)\\,j_\\ell\\!\\left[k(\\eta_0-\\eta)\\right]dx"}, {"t": "p", "en": "The angular power spectrum and matter power spectrum are then", "es": "El espectro angular de potencias y el espectro de potencias de la materia son entonces"}, {"t": "math", "tex": "C_\\ell=\\frac{2}{\\pi}\\int_0^\\infty k^2\\,P_{\\rm prim}(k)\\,|\\Theta_\\ell(k,0)|^2\\,dk,\\qquad P(k,x)=|\\Delta_M(k,x)|^2\\,P_{\\rm prim}(k)"}, {"t": "fig", "src": "public/figures/cmb/cmb_ps.png", "cen": "CMB temperature angular power spectrum $D_\\ell=\\ell(\\ell+1)C_\\ell/(2\\pi)$. The acoustic peaks and Silk damping tail are clearly visible.", "ces": "Espectro angular de potencias de temperatura del CMB $D_\\ell=\\ell(\\ell+1)C_\\ell/(2\\pi)$. Los picos acústicos y la cola de amortiguamiento de Silk son claramente visibles."}, {"t": "fig", "src": "public/figures/cmb/matter_ps.png", "cen": "Total matter power spectrum $P(k)$. The turnover corresponds to the scale entering the horizon at matter–radiation equality.", "ces": "Espectro de potencias total de la materia $P(k)$. El cambio de pendiente corresponde a la escala que entra en el horizonte en la igualdad materia–radiación."}, {"t": "fig", "src": "public/figures/cmb/cmb_map.png", "cen": "Full-sky CMB temperature map generated from the computed $C_\\ell$ using HEALPix.", "ces": "Mapa de cielo completo de temperatura del CMB generado a partir de los $C_\\ell$ calculados con HEALPix."}]}, {"h2en": "Bibliography", "h2es": "Bibliografía", "items": [{"t": "p", "en": "[1] Planck Collaboration, “Planck 2018 results. VI. Cosmological parameters,” A&A 641, A6, 2020.\n[2] H. A. Winther, AST5220 Cosmology II lecture notes, UiO, 2024.\n[3] C.-P. Ma & E. Bertschinger, “Cosmological perturbation theory in the synchronous and conformal Newtonian gauges,” ApJ 455, 7, 1995.\n[4] U. Seljak & M. Zaldarriaga, “A line-of-sight integration approach to CMB anisotropies,” ApJ 469, 437, 1996.\n[5] K. M. Górski et al., “HEALPix: A framework for high-resolution discretization and fast analysis of data distributed on the sphere,” ApJ 622, 759, 2005.", "es": "[1] Planck Collaboration, “Planck 2018 results. VI. Cosmological parameters,” A&A 641, A6, 2020.\n[2] H. A. Winther, notas del curso AST5220 Cosmología II, UiO, 2024.\n[3] C.-P. Ma y E. Bertschinger, “Cosmological perturbation theory in the synchronous and conformal Newtonian gauges,” ApJ 455, 7, 1995.\n[4] U. Seljak y M. Zaldarriaga, “A line-of-sight integration approach to CMB anisotropies,” ApJ 469, 437, 1996.\n[5] K. M. Górski et al., “HEALPix: A framework for high-resolution discretization and fast analysis of data distributed on the sphere,” ApJ 622, 759, 2005."}]}];

    html+='<section class="ft-section"><h2 class="ft-h2">'+esc(es?sec.h2es:sec.h2en)+'</h2>';
    sec.items.forEach(function(x){
      if(x.t==='p')html+='<p class="ft-p">'+esc(es?x.es:x.en)+'</p>';
      else if(x.t==='h3')html+='<h3 class="ft-h3">'+esc(es?x.es:x.en)+'</h3>';

      else if(x.t==='tab')html+='<div class="ft-table-wrap"><table class="ft-table"><thead><tr>'+x.headers.map(function(h){return'<th>'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'+x.rows.map(function(r){return'<tr>'+r.map(function(c){return'<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
    });
    html+='</section>';
  });
  document.getElementById('ft-body').innerHTML=html;
  renderFooter();
  if(window.renderMathInElement)setTimeout(function(){renderMathInElement(document.getElementById('ft-body'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});},100);
}

</script>
